<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Turbo Tayfa</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230a6fd6'/><text x='32' y='46' font-family='Arial Black,Arial' font-weight='900' font-size='40' text-anchor='middle' fill='%23ffd23f' stroke='%230b2a55' stroke-width='3' paint-order='stroke'>T</text></svg>" />
    <meta name="theme-color" content="#0a6fd6" />
    <link rel="preload" href="/fonts/baloo2-latin.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      /* Baloo 2 (OFL): kendi sunucumuzdan, değişken ağırlık 400-800; Türkçe için latin + latin-ext */
      @font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap; ascent-override: 96%; descent-override: 34%; line-gap-override: 0%; src: url(/fonts/baloo2-latin-ext.woff2) format('woff2'); unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
      @font-face { font-family: 'Baloo 2'; font-style: normal; font-weight: 400 800; font-display: swap; ascent-override: 96%; descent-override: 34%; line-gap-override: 0%; src: url(/fonts/baloo2-latin.woff2) format('woff2'); unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #cdeeff; font-family: system-ui, sans-serif; }
      #app canvas { display: block; }
      #debug {
        position: fixed; top: 76px; left: 50%; transform: translateX(-50%); padding: 4px 9px; border-radius: 8px; z-index: 11;
        background: rgba(10, 20, 40, 0.45); color: #fff; font-size: 12px; pointer-events: none; font-variant-numeric: tabular-nums;
      }

      /* Pist modelleri inerken üstte beliren küçük etiket */
      #busy {
        position: fixed; top: 18px; left: 50%; transform: translate(-50%, -80px); z-index: 60; padding: 10px 20px; border-radius: 14px;
        background: rgba(11, 42, 85, 0.85); color: #fff; font: 800 15px 'Baloo 2', system-ui, sans-serif; pointer-events: none;
        transition: transform 0.25s;
      }
      #busy.show { transform: translate(-50%, 0); }

      /* ---------- Açılış / yükleme ekranı ---------- */
      #loading {
        position: fixed; inset: 0; z-index: 100; overflow: hidden;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 26px;
        text-align: center; color: #fff; font-family: 'Baloo 2', system-ui, sans-serif;
        background: radial-gradient(circle at 50% 42%, #3cc8ff 0%, #0a6fd6 55%, #0a3d91 100%);
        transition: opacity 0.6s;
      }
      #loading.done { opacity: 0; pointer-events: none; }
      /* Arkada kayan hız çizgileri */
      #loading::before {
        content: ''; position: absolute; inset: -20% -50%;
        background: repeating-linear-gradient(100deg, transparent 0 60px, rgba(255, 255, 255, 0.07) 60px 64px, transparent 64px 140px);
        animation: tt-speed 1.1s linear infinite; pointer-events: none;
      }
      @keyframes tt-speed { to { transform: translateX(-140px); } }

      /* Logo: harfler sırayla zıplayarak düşer, sonra dalgalanır */
      .intro-logo {
        position: relative; margin: 0; font-family: 'Baloo 2', 'Arial Rounded MT Bold', system-ui, sans-serif; font-weight: 800;
        line-height: 0.9; transform: rotate(-5deg); user-select: none;
      }
      .intro-logo .row { display: block; white-space: nowrap; }
      .intro-logo .r1 { font-size: clamp(56px, 12vw, 116px); color: #ffd23f; }
      .intro-logo .r2 { font-size: clamp(64px, 13.5vw, 132px); color: #fff; margin-left: 0.35em; }
      .intro-logo span span {
        display: inline-block;
        -webkit-text-stroke: 4px #0b2a55; paint-order: stroke fill;
        text-shadow: 0 7px 0 #0b2a55, 0 14px 22px rgba(3, 20, 50, 0.35);
        opacity: 0; transform: translateY(-120px) scale(0.6);
        animation: tt-drop 0.7s cubic-bezier(0.25, 1.6, 0.45, 1) forwards, tt-wave 2.6s ease-in-out 1.4s infinite;
      }
      @keyframes tt-drop { to { opacity: 1; transform: none; } }
      @keyframes tt-wave {
        0%, 60%, 100% { transform: none; }
        70% { transform: translateY(-12px) rotate(-4deg); }
        80% { transform: translateY(3px) rotate(2deg); }
      }
      /* Logonun yanında parıltı */
      .intro-logo .spark {
        position: absolute; right: -0.35em; top: -0.15em; font-size: 0.4em; color: #fff;
        animation: tt-spark 1.8s ease-in-out 1.2s infinite; opacity: 0;
      }
      @keyframes tt-spark { 0%, 100% { opacity: 0; transform: scale(0.4) rotate(0); } 40% { opacity: 1; transform: scale(1.1) rotate(30deg); } }

      /* Yükleme yolu: dolan şerit + üstünde giden minik kart + sonda dama bayrağı */
      #loading .road { position: relative; width: min(360px, 76vw); padding-top: 30px; }
      #loading .bar { height: 12px; border-radius: 99px; background: rgba(255, 255, 255, 0.22); box-shadow: inset 0 2px 0 rgba(0, 0, 0, 0.15); }
      #loading .bar > div {
        position: relative; width: 0; height: 100%; border-radius: 99px; transition: width 0.25s ease-out;
        background: repeating-linear-gradient(135deg, #ffd23f 0 12px, #ffbe1a 12px 24px); background-size: 34px 100%;
        animation: tt-stripes 0.6s linear infinite;
      }
      @keyframes tt-stripes { to { background-position: 34px 0; } }
      #loading .kart { position: absolute; right: -22px; bottom: 8px; width: 46px; animation: tt-bump 0.28s ease-in-out infinite alternate; }
      @keyframes tt-bump { to { transform: translateY(-3px) rotate(-3deg); } }
      #loading .flag { position: absolute; right: -14px; bottom: 6px; width: 22px; }
      #loading .tip { font-weight: 800; font-size: 16px; opacity: 0.9; max-width: 80vw; min-height: 1.4em; transition: opacity 0.3s; }
      #loading .maker {
        position: absolute; left: max(18px, env(safe-area-inset-left)); top: max(14px, env(safe-area-inset-top));
        font-weight: 800; font-size: 15px; letter-spacing: 0.3px; opacity: 0; animation: tt-fade 0.8s ease 0.6s forwards;
        text-shadow: 0 2px 0 rgba(11, 42, 85, 0.5);
      }
      #loading .maker b { font-family: 'Baloo 2', system-ui, sans-serif; font-weight: 800; font-size: 20px; color: #ffd23f; margin-left: 4px; }
      @keyframes tt-fade { to { opacity: 0.95; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="debug"></div>
    <div id="busy">Pist yükleniyor…</div>
    <div id="loading">
      <h1 class="intro-logo" aria-label="Turbo Tayfa">
        <span class="row r1"><span>T</span><span>U</span><span>R</span><span>B</span><span>O</span></span>
        <span class="row r2"><span>T</span><span>A</span><span>Y</span><span>F</span><span>A</span></span>
        <span class="spark">✦</span>
      </h1>
      <div class="road">
        <svg class="flag" viewBox="0 0 22 30" aria-hidden="true">
          <rect x="1" y="0" width="2.5" height="30" rx="1" fill="#fff" />
          <g fill="#111"><rect x="3.5" y="1" width="6" height="5" /><rect x="15.5" y="1" width="6" height="5" /><rect x="9.5" y="6" width="6" height="5" /><rect x="3.5" y="11" width="6" height="5" /><rect x="15.5" y="11" width="6" height="5" /></g>
          <g fill="#fff"><rect x="9.5" y="1" width="6" height="5" /><rect x="3.5" y="6" width="6" height="5" /><rect x="15.5" y="6" width="6" height="5" /><rect x="9.5" y="11" width="6" height="5" /></g>
        </svg>
        <div class="bar"><div>
          <svg class="kart" viewBox="0 0 46 30" aria-hidden="true">
            <path d="M4 20 L8 12 L30 12 L40 17 L42 22 L4 22 Z" fill="#ff7a1a" stroke="#0b2a55" stroke-width="2" stroke-linejoin="round" />
            <circle cx="20" cy="8" r="6" fill="#ff9a3c" stroke="#0b2a55" stroke-width="2" />
            <path d="M15 4 L16 0 L19 3 M22 3 L25 0 L25.5 4" fill="#ff9a3c" stroke="#0b2a55" stroke-width="1.6" stroke-linejoin="round" />
            <circle cx="11" cy="23" r="5" fill="#23262e" stroke="#0b2a55" stroke-width="1.5" />
            <circle cx="35" cy="23" r="5" fill="#23262e" stroke="#0b2a55" stroke-width="1.5" />
            <circle cx="11" cy="23" r="2" fill="#ffd23f" /><circle cx="35" cy="23" r="2" fill="#ffd23f" />
          </svg>
        </div></div>
      </div>
      <div class="tip">İpucu: Virajda DRIFT'i basılı tut, bırakınca nitro kazan!</div>
      <div class="maker">Yapımcı<b>cafunify</b></div>
    </div>
    <script>
      // Harflere sırayla gecikme ver + ipuçlarını değiştir
      document.querySelectorAll('.intro-logo .row span').forEach((s, i) => {
        s.style.animationDelay = `${i * 0.07}s, ${1.4 + i * 0.09}s`;
      });
      (() => {
        const tips = [
          "İpucu: Virajda DRIFT'i (Space/Shift ya da DRIFT butonu) basılı tut, bırakınca nitro kazan!",
          'İpucu: Drift ne kadar uzun sürerse kıvılcım maviden turuncuya, mora döner; nitro daha güçlü olur.',
          'İpucu: "BAŞLA!" yazısından hemen önce gaza bas, roket gibi fırla!',
          'İpucu: Hindistan cevizini S basılıyken geriye de atabilirsin.',
          'İpucu: Balon kalkan bir isabeti tamamen emer.',
          'İpucu: Kum yavaşlatır ama turbo varken kuma aldırmazsın.',
          "İpucu: Palmiye Koyu'nda kum kısayolundaki hız tahtası sana turbo verir!",
          "İpucu: Çam Vadisi'nde rampadan hızlı çık, dereyi uçarak geç!",
          'İpucu: Yarışta 1-6 tuşlarıyla arkadaşlarına emoji at!',
        ];
        const el = document.querySelector('#loading .tip');
        let i = Math.floor(Math.random() * tips.length);
        el.textContent = tips[i];
        const timer = setInterval(() => {
          if (document.getElementById('loading').classList.contains('done')) return clearInterval(timer);
          el.style.opacity = 0;
          setTimeout(() => {
            el.textContent = tips[(i = (i + 1) % tips.length)];
            el.style.opacity = 0.9;
          }, 300);
        }, 2800);
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
